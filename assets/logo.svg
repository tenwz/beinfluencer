<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="beinfluencer logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#191430"/>
      <stop offset="1" stop-color="#07050e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.62">
      <stop offset="0" stop-color="#4a2f7a"/>
      <stop offset="1" stop-color="#0b0714"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b9d"/>
      <stop offset="0.55" stop-color="#c44dff"/>
      <stop offset="1" stop-color="#6c5cff"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b9d"/>
      <stop offset="1" stop-color="#6c5cff"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3d6ff"/>
    </linearGradient>
    <clipPath id="circle"><circle cx="256" cy="256" r="256"/></clipPath>
  </defs>

  <g clip-path="url(#circle)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="256" cy="250" r="238" fill="url(#glow)" opacity="0.8"/>

    <!-- 内圈 -->
    <circle cx="256" cy="256" r="214" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.08"/>

    <!-- 广播波 -->
    <g fill="none" stroke="url(#accent)" stroke-linecap="round">
      <path d="M139.3 372.7 A 165 165 0 0 1 139.3 139.3" stroke-width="22" opacity="0.85"/>
      <path d="M372.7 139.3 A 165 165 0 0 1 372.7 372.7" stroke-width="22" opacity="0.85"/>
      <path d="M104 407.9 A 215 215 0 0 1 104 104.1" stroke-width="22" opacity="0.42"/>
      <path d="M408 104.1 A 215 215 0 0 1 408 407.9" stroke-width="22" opacity="0.42"/>
    </g>

    <!-- 音符 -->
    <g transform="translate(-6 -14) translate(267 259) scale(1.06) translate(-267 -259)">
      <!-- 错位色（回声） -->
      <g opacity="0.45">
        <ellipse cx="216" cy="338" rx="39" ry="30" transform="rotate(-18 216 338)" fill="#25f4ee"/>
        <rect x="252" y="148" width="16" height="190" rx="8" fill="#25f4ee"/>
        <path d="M260 158 C 306 164 330 192 330 226 C 330 248 318 264 300 274"
              fill="none" stroke="#25f4ee" stroke-width="15" stroke-linecap="round"/>
      </g>
      <g opacity="0.45">
        <ellipse cx="232" cy="338" rx="39" ry="30" transform="rotate(-18 232 338)" fill="#fe2c55"/>
        <rect x="268" y="148" width="16" height="190" rx="8" fill="#fe2c55"/>
        <path d="M276 158 C 322 164 346 192 346 226 C 346 248 334 264 316 274"
              fill="none" stroke="#fe2c55" stroke-width="15" stroke-linecap="round"/>
      </g>

      <!-- 主音符 -->
      <ellipse cx="224" cy="338" rx="39" ry="30" transform="rotate(-18 224 338)" fill="url(#note)"/>
      <rect x="260" y="148" width="16" height="190" rx="8" fill="url(#note)"/>
      <path d="M268 158 C 314 164 338 192 338 226 C 338 248 326 264 308 274"
            fill="none" stroke="url(#note)" stroke-width="15" stroke-linecap="round"/>
    </g>
  </g>

  <circle cx="256" cy="256" r="252" fill="none" stroke="url(#accent2)" stroke-width="8"/>
</svg>
