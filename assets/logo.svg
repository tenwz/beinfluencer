      <path d="M401 111 A 205 205 0 0 1 401 401" stroke-width="26" opacity="0.45"/>
    </g>

    <!-- TikTok 音符 -->
    <g transform="translate(256 254) scale(9.9) translate(-12.05 -12)">
      <use href="#note" transform="translate(-0.6 -0.6)" fill="#25f4ee" opacity="0.9"/>
      <use href="#note" transform="translate(0.6 0.6)" fill="#fe2c55" opacity="0.9"/>
